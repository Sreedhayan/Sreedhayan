# ============================================================
#  CONTRIBUTION SNAKE — GENERATOR WORKFLOW
# ============================================================
# Place this file at .github/workflows/snake.yml inside a repository
# NAMED EXACTLY LIKE YOUR GITHUB USERNAME (a "profile repository"),
# e.g. github.com/Sreedhayan/Sreedhayan, with Actions enabled.
#
# GitHub Markdown cannot generate the snake animation itself — this
# workflow runs on a schedule, regenerates the SVGs from your live
# contribution graph, and pushes them to an "output" branch. The
# README references that branch directly via raw.githubusercontent.com.
# ============================================================

name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"        # once a day at 00:00 UTC
  workflow_dispatch:            # allows manual runs from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate the snake grid animation
        uses: Platane/snk@v3
        with:
          github_user_name: Sreedhayan
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push snake output to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
